[project]
name = "boardgames-api"
version = "0.1.0"
description = "FastAPI backend: REST API, WebSockets, and the server-authoritative game engine"
authors = [
    { name = "Daniel Yordanov", email = "daniyord@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.141.1",
    "uvicorn[standard]>=0.52.4",
]


[build-system]
requires = ["uv_build>=0.12.10,<0.13.0"]
build-backend = "uv_build"
